<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ChatGPT Mock column-reverse — TurnRail 测试台</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; background: #ffffff; color: #0d0d0d; }
  body.dark { background: #212121; color: #ececec; }
  aside {
    width: 240px; flex: none; border-right: 1px solid rgba(0,0,0,.08); padding: 12px;
    background: #f9f9f9;
  }
  body.dark aside { background: #171717; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    height: 52px; flex: none; position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; padding: 0 24px; font-weight: 600;
    background: rgba(255,255,255,.85); border-bottom: 1px solid rgba(0,0,0,.06);
  }
  body.dark header { background: rgba(33,33,33,.85); }
  /* 关键：复刻真实 ChatGPT 的 column-reverse 滚动容器 */
  #scroller {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column-reverse;
    padding: 8px 0 120px;
  }
  #thread { max-width: 760px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 18px; }
  [data-turn-key] { border-radius: 14px; }
  [data-user-message-bubble] {
    background: #f4f4f4; border-radius: 14px; padding: 10px 16px; margin-left: auto;
    max-width: 70%; width: fit-content;
  }
  body.dark [data-user-message-bubble] { background: #2f2f2f; }
  [data-markdown-text-style="assistant-message"] p { margin: 0.4em 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #toolbar {
    position: fixed; left: 250px; top: 8px; z-index: 500; display: flex; flex-wrap: wrap; gap: 6px;
    background: rgba(20,90,70,.08); border: 1px solid rgba(16,163,127,.35); padding: 6px; border-radius: 10px;
  }
  #toolbar button { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(16,163,127,.4); background: #fff; cursor: pointer; }
  #scrollinfo { position: fixed; left: 250px; bottom: 28px; z-index: 500; font-size: 11px; opacity: .7; font-family: Consolas, monospace; }
  #route { position: fixed; left: 250px; bottom: 8px; z-index: 500; font-size: 11px; opacity: .6; }
</style>
</head>
<body>
<aside>
  <strong style="font-size:13px">column-reverse Mock</strong>
  <button data-act="add1">+1 轮</button>
  <button data-act="add8">+8 轮</button>
  <button data-act="add60">+60 轮</button>
  <button data-act="stream">发送并流式回复</button>
  <button data-act="prepend10">向上懒加载 10 轮</button>
  <button data-act="theme">深色</button>
</aside>
<main>
  <header id="topbar">ChatGPT Mock — column-reverse 滚动容器</header>
  <div id="scroller" data-app-action-timeline-scroll>
    <div id="thread" data-thread-find-target="conversation"></div>
  </div>
</main>
<div id="toolbar">
  <span style="font-size:12px;padding:4px">column-reverse：scrollTop 0=视觉底部(最新)，负值=向历史顶部</span>
</div>
<div id="scrollinfo">scrollTop: 0</div>
<div id="route">route: /c/mock-rev-1111</div>

<script src="/dist/content.js"></script>
<script>
  window.__tnErrCount = 0
  window.addEventListener('error', () => { window.__tnErrCount++ })

  const scroller = document.getElementById('scroller')
  const thread = document.getElementById('thread')
  const info = document.getElementById('scrollinfo')
  let turnCounter = 0
  let uuidCounter = 0
  let turnSeq = []

  // 实时显示滚动坐标（观察负值语义）
  scroller.addEventListener('scroll', () => {
    info.textContent = `scrollTop: ${Math.round(scroller.scrollTop)}  scrollHeight: ${scroller.scrollHeight}`
  })

  function uuid(prefix) {
    uuidCounter++
    return `${prefix}-${uuidCounter.toString().padStart(4, '0')}-${Math.random().toString(36).slice(2, 8)}`
  }

  function makeTurn(userText, assistantText) {
    turnCounter++
    const userUuid = uuid('user')
    const assistantUuid = uuid('assistant')
    const turnRoot = document.createElement('div')
    turnRoot.dataset.turnKey = userUuid
    const inner = document.createElement('div')
    inner.dataset.contentSearchTurnKey = `fallback-turn-${turnCounter}`
    const userUnit = document.createElement('div')
    userUnit.dataset.chatgptSearchUnitKey = `fallback-turn-${turnCounter}:0:user`
    userUnit.dataset.chatgptSearchMessageIds = userUuid
    const bubble = document.createElement('div')
    bubble.dataset.userMessageBubble = 'true'
    const userMd = document.createElement('div')
    userMd.dataset.markdownTextTone = 'user-message'
    userMd.textContent = userText
    bubble.appendChild(userMd)
    userUnit.appendChild(bubble)
    const assistantUnit = document.createElement('div')
    assistantUnit.dataset.chatgptSearchUnitKey = `fallback-turn-${turnCounter}:2:assistant`
    assistantUnit.dataset.chatgptSearchMessageIds = `${assistantUuid} ${assistantUuid}`
    const h4 = document.createElement('h4')
    h4.dataset.conversationRole = 'assistant'
    h4.className = 'sr-only'
    h4.textContent = 'Assistant'
    const selection = document.createElement('div')
    selection.dataset.chatgptSelectionMessageId = assistantUuid
    const assistantMd = document.createElement('div')
    assistantMd.dataset.markdownTextStyle = 'assistant-message'
    const p = document.createElement('p')
    p.textContent = assistantText
    assistantMd.appendChild(p)
    selection.appendChild(assistantMd)
    assistantUnit.append(h4, selection)
    inner.append(userUnit, assistantUnit)
    turnRoot.appendChild(inner)
    return { root: turnRoot, userText, assistantText, p }
  }

  function appendTurn(userText, assistantText) {
    const item = makeTurn(userText, assistantText)
    thread.appendChild(item.root)
    turnSeq.push(item)
    return item
  }

  function questionText(i) {
    const samples = [
      '请详细解释简支桥梁 PINN 边界条件如何处理？',
      '两个网络分别训练还是联合训练效果更好？',
      '有没有相关论文推荐？最好 2024 年之后的',
      '理论推导部分可以再详细一点吗',
      '这个方法的创新点到底是什么',
      '损失函数权重应该如何设置',
      '帮我写一段数据预处理的 Python 代码',
      '训练不收敛可能是什么原因'
    ]
    return `Q${i}: ${samples[i % samples.length]}（第 ${i} 次提问）`
  }

  function addTurns(n, offset = 0) {
    const frag = document.createDocumentFragment()
    for (let i = 0; i < n; i++) {
      const text = questionText(offset + i + 1)
      const item = makeTurn(text, `这是对「${text.slice(0, 24)}…」的模拟回复。`)
      frag.appendChild(item.root)
      turnSeq.push(item)
    }
    thread.appendChild(frag)
  }

  function clearThread() {
    thread.textContent = ''
    turnSeq = []
    turnCounter = 0
  }

  let streamingTimer = 0
  function simulateStreaming() {
    const text = '这是正在流式生成的模拟回复，每隔几十毫秒追加一个词。'.repeat(3)
    const item = appendTurn(`流式测试问题 ${turnCounter + 1}`, '')
    const p = item.root.querySelector('[data-markdown-text-style="assistant-message"] p')
    let i = 0
    clearInterval(streamingTimer)
    streamingTimer = setInterval(() => {
      if (i >= text.length) return clearInterval(streamingTimer)
      p.textContent += text[i++]
      scroller.scrollTop = 0 // column-reverse：视觉底部即原点
    }, 45)
  }

  // 懒加载历史：向 thread 头部 prepend（视觉更上方），column-reverse 下原位置自动保持
  function prependHistory(n) {
    const frag = document.createDocumentFragment()
    for (let i = 0; i < n; i++) {
      const item = makeTurn(`（历史）H${n - i}: 很久以前提出的问题 ${n - i}`, `（历史回复 ${n - i}）`)
      turnSeq.unshift(item)
      frag.appendChild(item.root)
    }
    thread.prepend(frag)
  }

  document.body.addEventListener('click', (event) => {
    const act = event.target?.dataset?.act
    if (!act) return
    switch (act) {
      case 'add1': addTurns(1, turnSeq.length); break
      case 'add8': addTurns(8, turnSeq.length); break
      case 'add60': addTurns(60, turnSeq.length); break
      case 'stream': simulateStreaming(); break
      case 'prepend10': prependHistory(10); break
      case 'theme': document.body.classList.toggle('dark'); break
    }
  })

  history.replaceState(null, '', '/c/mock-rev-1111-4444')
  document.getElementById('route').textContent = 'route: /c/mock-rev-1111-4444'
  addTurns(12)
</script>
</body>
</html>
