name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 单元检查 job 无需任何写权限
permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # check = 版本一致性 + typecheck + 单元测试 + 生产构建；任一失败即 CI red
      - run: npm run check
