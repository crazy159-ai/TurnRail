name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 默认只读权限；需要写的 job 单独声明
permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # check = 版本一致性 + typecheck + 单元测试 + 生产构建；任一失败即 CI red
      - run: npm run check

  # 浏览器冒烟独立 job：避免 Node matrix × Playwright 重复下载 Chromium
  browser-smoke:
    name: browser smoke (Node 24)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
